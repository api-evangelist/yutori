aid: yutori
name: Yutori
description: >-
  Yutori builds AI web agents delivered as an API. Its Navigator (n1.5) computer-use
  model drives cloud browsers to navigate, click, type, and extract structured data,
  and is OpenAI Chat Completions compatible. Scouts are always-on agents that monitor
  the web and alert on changes; the Research API runs one-time multi-source web
  research; and a hosted MCP server exposes the same capabilities over the Model
  Context Protocol. Founded in 2024 by former Meta AI researchers and backed by
  Radical Ventures and Felicis, Yutori is strongly agent-native: API-key bearer auth,
  published llms.txt, agent Skills, an RFC 9727 API catalog, and OAuth resource
  metadata. Pay-as-you-go pricing with $5 in free credits.
